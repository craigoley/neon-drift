name: E2E (smoke)

# GATED browser smoke (L2). Playwright drives a real Chromium against the app to
# catch blank-screen / visual-boot bugs that the pure Vitest suite can't see.
# Browser jobs are slow, so this NEVER blocks the fast per-PR lint/test/build
# checks (in ci.yml). It runs nightly, on manual dispatch, on a PR explicitly
# labelled `e2e`, and on every Dependabot PR.
#
# WHY DEPENDABOT ALWAYS GETS THE SMOKE: claude-review.yml used to skip Dependabot
# PRs entirely, on the reasoning that "a three.js / Vite bump can pass tsc, vitest,
# CodeQL and OSV yet still break the render and auto-deploy to the public site."
# That reasoning is correct, but the conclusion — require a human — meant Dependabot
# (effectively the only PR author on this repo) got zero automation, and bumps piled
# up unmerged. Rendering breakage is exactly what this smoke detects, so running it
# on dependency bumps converts that human gate into a mechanical one.
# dependabot-auto-merge.yml is the other half: it waits for this job (by name)
# to pass before it merges a bump or dispatches the Claude review for a held one.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # nightly (06:00 UTC)
  pull_request:
    # `opened` matters for the Dependabot path: Dependabot pushes the branch and
    # opens the PR in one shot, so without it the smoke would only start on a
    # LATER push — and a bump that is never touched again would never get one.
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke
    # Non-PR events always run. PR events run when the `e2e` label is present, or
    # when the PR is a Dependabot bump (see the rationale in the header).
    #
    # KEEP THE JOB NAME AND THIS CONDITION IN SYNC with dependabot-auto-merge.yml:
    # its wait loop requires a check named "Playwright smoke" to be PRESENT and
    # SUCCESS on the PR, not merely "not failing". A skipped job would never
    # satisfy it, so a bump cannot slip through with no browser coverage.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
      || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium + its OS deps. Pinned to chromium only (the smoke needs one engine).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Surface the report/traces on failure for debugging. `test-results/` is included
      # because it holds the `*-actual.png` screenshots (and any baseline Playwright
      # wrote on a missing-snapshot run) — without it, a screenshot failure gives you
      # the diff view but no way to recover the actual image. To (re)generate committed
      # baselines, prefer the dedicated `Visual baselines (regenerate)` workflow.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
