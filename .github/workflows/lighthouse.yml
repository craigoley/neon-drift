name: Lighthouse (web productionization audit)

# ON-DEMAND Lighthouse audit of the BUILT page — the productionization analogue of the L3 validation
# sweep: the sweep keeps the GAME good, this keeps the PAGE good (meta/share/manifest/a11y/SEO). It
# MEASURES (Accessibility, Best Practices, SEO) and surfaces regressions; it does NOT hard-fail
# (assertions are "warn") and it does NOT gate Performance — software SwiftShader in CI inflates
# TBT/CPU and the score reflects the inherent WebGL game loop, not a page defect (judge perf on a
# real device).
#
# Deliberately OFF the per-PR path: workflow_dispatch + a monthly schedule only — NO `pull_request`
# trigger. So it can never become a merge-blocking check and never trips/loops the claude-review
# review-and-merge pipeline (which fires on pull_request events). Mirrors validation.yml's safety.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *' # monthly, 1st @ 06:00 UTC

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Lighthouse CI: boots `vite preview`, audits the built page with software WebGL (see lighthouserc.json),
      # asserts the page categories at warn level, and uploads the HTML/JSON reports as artifacts.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
