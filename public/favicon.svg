<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Neon Drift">
  <!-- Neon Drift — synthwave sun over a neon grid horizon. Pure SVG, reads at 16px.
       Palette reused from the game: #1a0033 deep purple, #ff00ff magenta, #ff6600 accent, #00ffff cyan. -->
  <defs>
    <linearGradient id="nd-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff00ff"/>
      <stop offset=".55" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <clipPath id="nd-above"><rect x="0" y="0" width="64" height="40"/></clipPath>
  </defs>
  <!-- backdrop -->
  <rect width="64" height="64" rx="10" fill="#1a0033"/>
  <!-- setting sun (only the half above the horizon shows), with venetian slits -->
  <g clip-path="url(#nd-above)">
    <circle cx="32" cy="40" r="17" fill="url(#nd-sun)"/>
    <rect x="13" y="31.5" width="38" height="2.2" fill="#1a0033"/>
    <rect x="13" y="35.4" width="38" height="2.6" fill="#1a0033"/>
  </g>
  <!-- horizon -->
  <rect x="5" y="39.2" width="54" height="1.8" fill="#00ffff"/>
  <!-- perspective grid converging to the vanishing point at (32,40) -->
  <g stroke="#00ffff" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M32 41 L7 59"/>
    <path d="M32 41 L19 59"/>
    <path d="M32 41 L32 59"/>
    <path d="M32 41 L45 59"/>
    <path d="M32 41 L57 59"/>
    <path d="M11 50 H53" opacity=".9"/>
    <path d="M6 59 H58"/>
  </g>
</svg>
