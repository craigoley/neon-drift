name: Claude PR Review & Merge

on:
  pull_request:
    # `ready_for_review` is a deliberate neon-drift-specific divergence from
    # ClawApp parity: visual PRs open as DRAFT, get playtested on device, then
    # are marked "Ready for review" — that transition fires this trigger so the
    # auto-merge runs hands-off. (Drafts still can't be merged: GitHub blocks
    # merging a draft PR, so `gh pr merge` no-ops until the PR is ready.)
    types: [opened, synchronize, ready_for_review]
    # Skip auto-review on PRs that only edit this workflow file. The
    # `anthropics/claude-code-action@v1` action refuses to run when its
    # workflow file differs from the version on `main` (a security check that
    # prevents attackers from PRing malicious workflow edits and having the
    # action execute them under privileged context). On a single-developer
    # personal repo there's no attacker, but the action still self-fails with
    # exit 1 every time, leaving a recurring red ✗ on every workflow-edit PR.
    # `paths-ignore` short-circuits the trigger so the workflow doesn't run at
    # all on those PRs. Comment-driven `@claude` invocations still fire (they're
    # on the `issue_comment` trigger below) to review a workflow-edit PR.
    paths-ignore:
      - '.github/workflows/claude-review.yml'
  issue_comment:
    types: [created]
  # DEPENDABOT PATH. Dependency bumps are excluded from the `pull_request` trigger
  # above (see the job `if:`) and come in through here instead, once the browser
  # smoke has actually gone green on the bump. That ordering is the whole point:
  # a bump can pass tsc, vitest, CodeQL and OSV and still break the render, so the
  # smoke — not a human — is what clears it to merge and auto-deploy.
  #
  # A workflow_run job always runs the DEFAULT-BRANCH copy of this file, whatever
  # the PR contains. Two consequences worth knowing:
  #   * the `paths-ignore` above cannot protect this path (paths-ignore applies to
  #     pull_request only), but it does not need to — a PR editing this workflow
  #     cannot influence the version that executes here.
  #   * for the same reason, claude-code-action's "workflow file differs from main"
  #     self-check is trivially satisfied on this path.
  workflow_run:
    workflows: ["E2E (smoke)"]
    types: [completed]

# Workflow-level default: read-only. The review-and-merge job below overrides
# with the write scopes the action actually needs (contents, pull-requests,
# issues, id-token). Defining the workflow default explicitly so any future job
# added here inherits a minimum-privilege baseline rather than the implicit
# Actions default.
permissions:
  contents: read

concurrency:
  # Scope by EVENT TYPE. Without this, a bot comment (issue_comment — e.g.
  # vercel[bot]'s preview-deploy comment, which lands on every PR) shares the
  # same group as the pull_request review run and, with cancel-in-progress,
  # CANCELS it mid-flight ("Set up job: cancelled") before it can merge. Observed
  # directly: a vercel[bot] comment killed the review run ~2s after it started.
  # Including event_name keeps comment events in their own group; within an event
  # type, cancel-in-progress still supersedes a stale run (a new push cancels an
  # older review of the same PR).
  #
  # workflow_run payloads carry no PR number, so that path keys on the head branch
  # instead — same effect (one in-flight review per PR), since a branch maps 1:1 to
  # its open PR here.
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review-and-merge:
    # The action pushes commits using ${{ github.token }} (the workflow's
    # default GITHUB_TOKEN), so commits authored by this workflow appear under
    # `github-actions[bot]`, NOT `claude[bot]`. Both guards below check
    # `github-actions[bot]`. If you ever switch to the Claude GitHub App by
    # passing `github_token` to the action, change both checks to `claude[bot]`.
    #
    # TRUST GATE (pull_request path): run only on PRs whose head branch lives in
    # THIS repo (head.repo.full_name == github.repository) — i.e. created by a
    # write-access user, never an outside fork. That is the exact security
    # property the privileged SHA-pinned checkout needs, and it is independent of
    # org-membership visibility.
    #
    # WHY NOT author_association: it was `== OWNER || MEMBER`, but the Actions
    # EVENT payload only reports MEMBER for PUBLIC org members. The operator's
    # membership in this org is PRIVATE, so the payload reported a lesser
    # association, the if was always false, and review-and-merge was SKIPPED on
    # every PR — the auto-merge never ran (all PRs were merged by hand). Evidence:
    # GET /orgs/craigoley/public_members/<user> -> 404 (private) while the
    # authenticated REST API reads MEMBER. The same-repo check is not subject to
    # that visibility quirk. (The issue_comment path below still uses
    # author_association and has the same latent limitation — out of scope here;
    # it is not part of the hands-off auto-merge pipeline.)
    #
    # draft == false preserves the DRAFT GATE: draft PRs are neither reviewed nor
    # merged. Marking a draft "Ready for review" fires ready_for_review (see the
    # trigger above), flips draft to false, and lets the run proceed.
    #
    # Dependabot PRs are skipped ON THIS TRIGGER — not skipped outright. They are
    # handled by the workflow_run branch below, which only fires after the browser
    # smoke has passed on the bump. The concern that originally excluded them (a
    # three.js / Vite bump that type-checks and tests clean but breaks the render,
    # then auto-deploys to the public site) is real; gating on the smoke addresses
    # that concern directly instead of by requiring a human.
    # github-actions[bot] is skipped to prevent self-loops on Claude's push-backs.
    #
    # THIRD BRANCH (workflow_run): a coarse pre-filter only. It cannot see the PR,
    # so it can only assert that a same-repo pull_request-triggered E2E run
    # finished. Everything that actually matters — that the PR is Dependabot's,
    # open, not a draft, and that the "Playwright smoke" JOB really ran and
    # succeeded rather than being skipped — is enforced in the "Resolve PR context"
    # step, which can query the API. Note `workflow_run.conclusion == 'success'` is
    # NOT sufficient on its own: an all-skipped run also reports success.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.user.login != 'github-actions[bot]' &&
       !contains(github.event.pull_request.head.ref, 'claude-fix'))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER') &&
       contains(github.event.comment.body, '@claude'))
      ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 30
    steps:
      # Resolve the PR this run is about, and — on the workflow_run path — decide
      # whether it has actually earned a review. The job-level `if:` above cannot
      # do this: a workflow_run payload has no PR in it, so every real check lives
      # here where the API is reachable.
      #
      # The head SHA is resolved from the API at trigger time so the subsequent
      # checkout pins to an immutable commit instead of a mutable branch ref.
      # Guards against an Untrusted-Checkout TOCTOU: without it, someone who can
      # push to the PR branch could force-push between the checks below and the
      # checkout, running their code under privileged context.
      - name: Resolve PR context
        id: pr-sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # Branch names and run ids are payload-controlled. Pass them through env
          # rather than `${{ }}` interpolation so bash sees literal strings.
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # `bail` = "nothing to do, exit cleanly" — a green no-op, not a failure.
          # Only genuinely broken states below exit non-zero. Written exactly once
          # per run so the result never depends on GITHUB_OUTPUT key precedence.
          bail() {
            echo "$1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT" == "workflow_run" ]]; then
            # The E2E run tells us a branch; find that branch's open PR.
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "$WF_BRANCH" --state open \
              --json number --jq '.[0].number // ""')
            if [[ -z "$PR_NUMBER" ]]; then
              bail "E2E run for branch '$WF_BRANCH' has no open PR — nothing to review."
            fi

            # The run's own conclusion is NOT enough: a workflow whose only job was
            # skipped still reports the RUN as successful. Require the smoke job
            # itself to exist and to have concluded `success`.
            SMOKE=$(gh api "repos/$REPO/actions/runs/$WF_RUN_ID/jobs" --paginate \
              --jq '[.jobs[] | select(.name == "Playwright smoke") | .conclusion] | join(",")')
            if [[ "$SMOKE" != "success" ]]; then
              bail "Playwright smoke did not pass (conclusion: '${SMOKE:-<job absent>}') — not merging."
            fi
          else
            PR_NUMBER="$PR_FROM_EVENT"
          fi

          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json headRefOid,headRefName,author,isDraft,state)
          SHA=$(echo "$PR_JSON" | jq -r .headRefOid)
          BRANCH=$(echo "$PR_JSON" | jq -r .headRefName)
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login // ""')
          if [[ -z "$SHA" || "$SHA" == "null" ]]; then
            echo "Could not resolve head SHA for PR #$PR_NUMBER" >&2
            exit 1
          fi
          if [[ -z "$BRANCH" || "$BRANCH" == "null" ]]; then
            echo "Could not resolve head branch for PR #$PR_NUMBER" >&2
            exit 1
          fi

          if [[ "$EVENT" == "workflow_run" ]]; then
            # This path exists ONLY to auto-merge Dependabot. Human PRs are already
            # reviewed on their `pull_request` trigger; letting them in here too
            # would double-review every labelled PR.
            #
            # MIND THE LOGIN FORMAT. `gh pr view --json author` reports Dependabot
            # as `app/dependabot` — NOT the `dependabot[bot]` spelling the webhook
            # payload uses (which is what e2e.yml matches on). Getting this wrong
            # fails CLOSED and silently blocks every bump, so all three spellings
            # are accepted.
            case "$AUTHOR" in
              app/dependabot|dependabot|'dependabot[bot]') ;;
              *)
                bail "PR #$PR_NUMBER is authored by '$AUTHOR', not Dependabot — handled by the pull_request trigger."
                ;;
            esac
            if [[ "$(echo "$PR_JSON" | jq -r .isDraft)" == "true" ]]; then
              bail "PR #$PR_NUMBER is a draft — skipping."
            fi
            # The smoke proves a SPECIFIC commit renders. If the branch moved since
            # that run started, the green tells us nothing about what we would be
            # merging. Bail and let the new push's own smoke re-trigger this.
            if [[ "$SHA" != "$WF_SHA" ]]; then
              bail "Branch moved since the smoke ran (tested $WF_SHA, head is now $SHA) — waiting for the newer run."
            fi
          fi

          {
            echo "number=$PR_NUMBER"
            echo "sha=$SHA"
            echo "branch=$BRANCH"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Check last commit author
        id: check-author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PROCEED: ${{ steps.pr-sha.outputs.proceed }}
          PR_NUMBER: ${{ steps.pr-sha.outputs.number }}
        run: |
          set -euo pipefail
          # Every downstream step keys off `skip`, so fold the resolve step's
          # verdict into it — one gate to read instead of two.
          if [[ "$PROCEED" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An explicit `@claude` comment is a human asking for a re-review, so it
          # is allowed even when Claude authored the last commit.
          if [[ "$EVENT" == "issue_comment" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # THE LOOP BRAKE. If this workflow authored the last commit, stop — so a
          # push-back does not re-trigger a review of itself, forever. This matters
          # more than it used to: the Dependabot path is a genuine cycle (push →
          # CI + smoke → workflow_run → review → push → …), and this step is the
          # only thing that ends it.
          #
          # Match every spelling the push could land under rather than a single
          # one. The action normally commits via ${{ github.token }}, which attributes
          # to `github-actions[bot]`, but this repo's history also contains a
          # `claude[bot]`-authored commit (c9b5e7c) from an earlier configuration,
          # and `gh` renders app logins with an `app/` prefix in some payloads. A
          # missed spelling here is an infinite CI loop, while a spurious match only
          # skips one review — so this errs deliberately toward stopping.
          #
          # BOT ACCOUNTS ONLY — do NOT add bare `claude` here. Commits from a local
          # Claude Code session are authored `Claude <noreply@anthropic.com>`, which
          # resolves to the ordinary GitHub user `claude` (a DIFFERENT account from
          # `claude[bot]`). Most hand-written feature work in this repo carries that
          # authorship, so matching it would silently disable review on nearly every
          # human-initiated PR.
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json commits --jq '.commits[-1].authors[0].login // ""')
          case "$AUTHOR" in
            github-actions|'github-actions[bot]'|app/github-actions|'claude[bot]'|app/claude)
              echo "Last commit was by '$AUTHOR' (this workflow) — skipping to prevent loop."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Exit if there is nothing to review
        if: steps.check-author.outputs.skip == 'true'
        run: echo "Gate closed (see 'Resolve PR context' / 'Check last commit author') — skipping."

      # Privileged checkout, reachable from the issue_comment and workflow_run
      # triggers. CodeQL may flag this (actions/untrusted-checkout); the
      # sanitizers are in place:
      #   1. the job-level `if:` requires author_association in (OWNER, MEMBER)
      #      AND, for comments, an `@claude` body — only the owner can fire it.
      #   2. `ref:` is the resolved-at-trigger-time head SHA, not the mutable
      #      branch ref, so a force-push after the trust check can't swap it out.
      #   3. for workflow_run, the head must be same-repo (job `if:`) and the PR
      #      must be Dependabot's ("Resolve PR context") — so the checked-out tree
      #      is this repo's code plus a machine-generated manifest bump, never an
      #      outside contributor's branch.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.check-author.outputs.skip != 'true'
        with:
          # SHA-pinned (immutable). NOT `head.ref` — branch refs are mutable and
          # race the gate steps above.
          ref: ${{ steps.pr-sha.outputs.sha }}
          fetch-depth: 0

      # Re-attach HEAD to a named local branch matching the PR's head branch.
      # actions/checkout@v6 leaves a detached HEAD when given a SHA, and the
      # action's push-back code is most portable pushing from a named local
      # branch with a matching upstream. If the remote branch was force-pushed
      # since we resolved the SHA, the push is rejected as non-fast-forward —
      # the desired fail-closed behavior.
      - name: Re-attach HEAD to PR branch for push-back
        if: steps.check-author.outputs.skip != 'true'
        # PR head ref names are caller-controlled and could contain shell
        # metacharacters. Pass through env rather than `${{ … }}` interpolation
        # so bash sees the literal string via `$BRANCH` (guards code injection).
        env:
          BRANCH: ${{ steps.pr-sha.outputs.branch }}
        run: |
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH" 2>/dev/null || true

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1
        if: steps.check-author.outputs.skip != 'true'
        env:
          # Authenticate the gh CLI used by the Bash tool (gh pr comment/merge).
          GH_TOKEN: ${{ github.token }}
        with:
          # OAuth via Craig's Max subscription — same auth ClawApp uses.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Force tag mode so the review summary posts as a tracking comment.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr-sha.outputs.number }}
            BRANCH: ${{ steps.pr-sha.outputs.branch }}
            TRIGGER: ${{ github.event_name }}

            You are the sole code reviewer for Neon Drift, a synthwave endless
            racing game built with TypeScript + Three.js + Vite and deployed to
            Vercel as a static site. Your job is to review this pull request, fix
            any issues you find, and merge it when it meets quality standards.

            ## Review Phase

            Review the full diff. Post findings as inline review comments.

            ### Project hard rules — flag any violation immediately

            **1. Purity of the game layer (THE load-bearing rule)**
            `src/game/` is pure TypeScript and MUST NOT import 'three' anywhere.
            Any `import ... from 'three'` (or a transitive import that pulls three
            in) under `src/game/` is a hard failure — flag it at the top of your
            review. Game logic must stay runnable and testable in Node with no
            WebGL. The rendering layer (`src/rendering/`) reads game state and
            never mutates it; flag renderers that write back into game state.

            **2. No magic numbers outside utils/constants.ts**
            All tuning values live in `src/utils/constants.ts`. Flag any numeric
            literal used as a tuning/gameplay/dimension value elsewhere (loop
            indices, 0/1 identities and obvious math constants are fine).

            **3. No allocations in the requestAnimationFrame hot loop**
            Flag object/array/vector allocations inside the per-frame render loop
            (anything reached from `requestAnimationFrame`): `new THREE.Vector3()`,
            `new THREE.Color()`, array/object literals, `.map`/`.filter` that
            allocate, closures created per frame. Vectors and scratch objects
            should be created once and reused.

            **4. Touch input parity with keyboard**
            Mobile is required. Any new keyboard control must have an equivalent
            touch path, and vice versa. Flag input changes that add one without the
            other.

            **5. TypeScript strict — no implicit any**
            Flag implicit `any`, unsafe casts (`as any`, non-null `!` that hides a
            real nullable), and types that defeat strict mode.

            ### Also review for
            - Correctness: logic errors, off-by-one, broken edge cases, regressions
            - Whether all callers of a changed function/type were updated
            - Swallowed errors, dead code, duplicated logic

            ### What to ignore
            - Style/formatting (prettier/eslint territory)
            - TODO/FIXME comments (intentional)
            - Lock files, generated files, build artifacts
            - Test code that intentionally exercises edge cases

            ### Dependency bumps (Dependabot PRs)

            If TRIGGER is `workflow_run`, this is a Dependabot bump that has ALREADY
            passed the Playwright browser smoke — that is the only reason you are
            being run on it. The hard rules above are about hand-written game code
            and mostly will not apply. Review it as a dependency change instead:

            - **Scope.** The diff should touch only `package.json` and
              `package-lock.json` (or `.github/workflows/*` for an actions bump).
              Anything else in the diff is unexpected — investigate before merging.
            - **package.json vs lockfile agreement.** Every range change in
              `package.json` should be reflected in the lockfile, and the lockfile
              should not carry unrelated version churn.
            - **Held-back deps.** `.github/dependabot.yml` documents deliberate
              holds, currently `typescript` majors (typescript-eslint's peer range
              stops at `<6.1.0`). If a bump contradicts a documented hold, do NOT
              merge — comment explaining the conflict and tag @craigoley.
            - **Major versions of runtime deps** (`three`, and `vite` as the
              bundler) deserve a look at the upstream changelog for breaking
              changes, even with the smoke green. Patch and minor bumps of dev
              tooling do not need that.
            - Do NOT line-read the lockfile. `npm ci`, lint, test, build and the
              smoke all passed; that is the evidence. Judge scope and intent.

            ## Fix Phase

            If you find issues:
            1. Fix them directly in the code.
            2. Before committing, verify the change is safe:
               - Run `npx tsc --noEmit` and confirm it's clean.
               - Run `npm test` and confirm the suite is green.
               If either fails, iterate on your fix until both pass — do NOT push
               broken code.
            3. Commit your fixes to the PR branch with a clear commit message.
            4. Push the changes.
            5. Re-review your own fixes to confirm they're correct.

            ## Merge Phase

            After review (and fixes if needed), if the PR meets quality standards:
            1. Post a brief summary comment on the PR noting what you reviewed and
               any fixes made.
            2. Approve the PR.
            3. Merge with: `gh pr merge <number> --squash --delete-branch`
               (NOT `--auto` — this repo has no auto-merge enabled and no branch
               protection rules, so a plain squash-merge runs immediately.)

            If the PR has fundamental issues that can't be auto-fixed (wrong
            approach, needs architectural discussion, missing tests for complex new
            features), post a detailed comment explaining the concerns and do NOT
            merge. Tag @craigoley in that comment so I see it.

          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools "Edit,Write,Read,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(npx tsc:*),Bash(npm test:*),mcp__github_inline_comment__create_inline_comment"
