name: Dependabot auto-merge

# WHY THIS WORKFLOW EXISTS
#
# Ported from wild-trails / rogue-descent (where it has merged every safe bump
# since it landed). neon-drift relied on a different path: claude-review.yml's
# `workflow_run` trigger after "E2E (smoke)". That path has never fired for a
# Dependabot PR — its only runs are the nightly `main` E2E (all skipped) — so
# every bump sat open: #232 (Aug 10) through #246 (Oct 21), all green.
# (Update 2026-10-29: that path now fires for Dependabot bumps, but every such
# run fails inside claude-code-action — "Workflow initiated by non-human
# actor: dependabot (type: Bot)" — because `allowed_bots` only admits
# github-actions[bot] on workflow_dispatch. e.g. run 40944696677 for #237. So
# held bumps here also reach review only through the dispatch below.)
#
# Two things changed since that exclusion was written:
#   1. E2E (smoke) runs the Playwright smoke job, which boots the BUILT app in headless
#      Chromium and asserts the canvas actually renders (not blank) with no
#      console errors. That is precisely the "it broke the render" failure mode
#      the human-review carve-out was protecting against, and it is now
#      machine-checked on every PR.
#   2. Dependabot groups dev-tooling into one PR, so the volume that needs a
#      human eye is small and well-identified.
#
# So this workflow narrows the carve-out instead of removing it: LOW-RISK bumps
# merge themselves once every check is green; anything that can reach the
# shipped bundle still gets reviewed before it merges (see HELD below).
#
#   AUTO-MERGED  patch/minor bumps of devDependencies, indirect (transitive)
#                deps, and GitHub Actions versions.
#   HELD         every major bump, and every `direct:production` bump — today
#                that means `three` and `@upstash/redis`, the two runtime
#                dependencies.
#
# HELD PRs GO TO THE AUTOMATED CLAUDE REVIEW, not to a hand merge. Once their
# checks are green this workflow dispatches `claude-review.yml` with
# `pr_number` — the same `gh workflow run` call `pr-sweeper.yml` makes — and
# that run reviews the diff, then merges or tags Craig and holds. Before this,
# held PRs waited ~24h for the sweeper to do the same dispatch.
#   - Waiting for green first matters: the E2E smoke (the render check) is not
#     a required status check on `main`, so a review dispatched at `opened`
#     could merge a `three` bump before the smoke had reported. Red checks fail
#     this job and do NOT dispatch; pr-sweeper.yml picks those up after 24h.
#   - Exactly one dispatch per PR. State lives in the hold comment (hidden
#     markers `auto-merge-hold` / `claude-review-dispatched`), so every trigger
#     — including a `synchronize` rebase that cancels an in-flight wait — can
#     run this safely and only the first green run dispatches. A dispatch on
#     every rebase would re-run a full Opus review each time; claude-review's
#     concurrency (one group per event + PR, cancel-in-progress) would only
#     cancel the older run mid-review, not dedupe it.
#   - A `workflow_dispatch` made with GITHUB_TOKEN does start a run — it is one
#     of the documented exceptions to the no-recursion rule:
#     https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
#
# SECURITY NOTE: this workflow runs on `pull_request` (NOT
# `pull_request_target`) and NEVER checks out the PR branch. It only makes API
# calls with the GITHUB_TOKEN, so the `contents: write` scope below is never
# exposed to code from the PR. Dependabot-triggered runs get a read-only token
# by default; the job-level `permissions:` block is the documented way to
# elevate it, and no repo secrets are needed here:
# https://docs.github.com/en/code-security/reference/supply-chain-security/troubleshoot-dependabot/dependabot-on-actions
# The dispatched claude-review run executes main's copy of that workflow in
# its own context, which is where CLAUDE_CODE_OAUTH_TOKEN is available.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Workflow-level default is read-only; the job below elevates only what it needs.
permissions:
  contents: read

concurrency:
  # A Dependabot rebase (synchronize) supersedes the in-flight run for the same
  # PR — the older run is watching a head SHA that no longer exists.
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge
    # Drafts are never merged, matching the draft gate in claude-review.yml.
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # squash-merge and delete the branch
      pull-requests: write # post / update the hold comment
      actions: write # gh workflow run claude-review.yml (held PRs)
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Parses the `updated-dependencies:` YAML block Dependabot writes into the
      # commit message. For a GROUPED PR the outputs are aggregated to the
      # highest-risk member (production outranks development, major outranks
      # minor), so one risky member holds the whole group back — fail-closed,
      # which is what we want.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide eligibility
        id: gate
        env:
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          HOLD_REASON=""

          # 1. Majors always get a review. A major can change API surface in ways
          #    a green build still hides (removed export used only at runtime).
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) HOLD_REASON="\`${UPDATE_TYPE:-unknown}\` is not a patch or minor bump" ;;
          esac

          # 2. Anything that reaches the shipped bundle gets a review. Note that
          #    GitHub Actions bumps are reported as `direct:production` even
          #    though they only touch CI and can never reach the bundle, so the
          #    ecosystem check has to run before the production verdict sticks.
          if [[ -z "$HOLD_REASON" ]]; then
            case "$DEP_TYPE" in
              direct:development|indirect) ;;
              *)
                if [[ "$ECOSYSTEM" != "github_actions" && "$ECOSYSTEM" != "github-actions" ]]; then
                  HOLD_REASON="\`${DEP_TYPE:-unknown}\` is a runtime dependency — a bump can pass every check and still break the render in the deployed bundle"
                fi
                ;;
            esac
          fi

          if [[ -n "$HOLD_REASON" ]]; then
            echo "HELD: $HOLD_REASON"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=$HOLD_REASON" >> "$GITHUB_OUTPUT"
          else
            echo "ELIGIBLE: $DEP_TYPE / $UPDATE_TYPE ($ECOSYSTEM)"
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      # Explain the hold once per PR, and read back whether the Claude review
      # was already dispatched. Both facts live in one comment, keyed by hidden
      # markers, so a rebase never re-comments or re-dispatches. pr-sweeper.yml
      # ignores comments carrying `auto-merge-hold` — without that it would
      # take this github-actions[bot] comment for a finished Claude review.
      - name: Post or find the hold comment
        id: hold
        if: steps.gate.outputs.eligible == 'false'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          set -euo pipefail
          found=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '
            .[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- auto-merge-hold -->")))
                | "\(.id) \(.body | contains("<!-- claude-review-dispatched -->"))"')
          found=${found%%$'\n'*}

          if [[ -n "$found" ]]; then
            read -r id dispatched <<<"$found"
            echo "Hold comment $id already posted (review dispatched: $dispatched)."
          else
            # printf, not a multi-line string literal: continuation lines of a
            # literal inside this indented `run:` block would carry 10 spaces of
            # indentation, which GitHub renders as a code block.
            # shellcheck disable=SC2016
            BODY=$(printf '%s\n' \
              '<!-- auto-merge-hold -->' \
              "🤖 **Held for the automated Claude review** — not auto-merged because ${REASON}." \
              '' \
              'Auto-merge covers patch/minor bumps of devDependencies, transitive deps and GitHub Actions. Everything else goes to the automated Claude review (`claude-review.yml`) as soon as this PR'"'"'s checks are green: Claude reviews the diff, then merges it or tags Craig and holds it. See `.github/workflows/dependabot-auto-merge.yml`.')
            id=$(gh api "repos/$REPO/issues/$PR/comments" -f body="$BODY" --jq .id)
            dispatched=false
            echo "Posted hold comment $id."
          fi
          echo "comment_id=$id" >> "$GITHUB_OUTPUT"
          echo "dispatched=$dispatched" >> "$GITHUB_OUTPUT"

      # Wait for the rest of the PR's checks, then require them ALL to be green.
      #
      # Why a poll instead of `gh pr merge --auto`: `--auto` waits only for the
      # REQUIRED status checks, and the `protect-main` ruleset requires just
      # Lint, Test and Build. `Playwright smoke` is not required, so `--auto`
      # would merge as soon as those three are green — before the render smoke
      # had reported. This loop is the only gate that covers `Playwright smoke`.
      #
      # Held PRs wait here too (until their review is dispatched), so Claude
      # never reviews — and possibly merges — before the E2E smoke has reported.
      - name: Wait for all checks to pass
        if: steps.gate.outputs.eligible == 'true' || steps.hold.outputs.dispatched == 'false'
        env:
          # Our own check run is in this PR's rollup; waiting on it would
          # deadlock, so it is filtered out by workflow name.
          SELF_WORKFLOW: ${{ github.workflow }}
          NEXT_STEP: ${{ steps.gate.outputs.eligible == 'true' && 'merging' || 'dispatching the Claude review (pr-sweeper.yml retries after 24h)' }}
        run: |
          set -euo pipefail

          # These must be PRESENT and successful, not merely "not failing".
          # Without a presence requirement the loop would see an empty rollup
          # moments after `opened` and merge before any check had registered.
          # Names come from the job `name:` fields in ci.yml — keep in sync.
          REQUIRED=("Lint" "Test" "Build" "Playwright smoke")

          DEADLINE=$(( SECONDS + 20 * 60 ))
          while :; do
            gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
              | jq --arg self "$SELF_WORKFLOW" '
                  [ .statusCheckRollup[]
                    # Commit statuses (Vercel) and check runs (Actions) carry
                    # their state in different fields — normalise both to one
                    # {name, state} shape before judging them.
                    | if .__typename == "StatusContext"
                      then { name: .context, state: .state, workflow: "" }
                      else { name: .name,
                             state: (if .status == "COMPLETED"
                                     then (.conclusion // "NEUTRAL")
                                     else "PENDING" end),
                             workflow: (.workflowName // "") }
                      end
                  ]
                  | map(select(.workflow != $self))
                ' > checks.json

            FAILED=$(jq -r '
              [ .[] | select(.state | IN("SUCCESS","SKIPPED","NEUTRAL","PENDING","EXPECTED","QUEUED","IN_PROGRESS") | not) ]
              | map("\(.name) [\(.state)]") | join(", ")' checks.json)
            if [[ -n "$FAILED" ]]; then
              echo "::error::Not ${NEXT_STEP} — failing checks: $FAILED"
              exit 1
            fi

            PENDING=$(jq -r '
              [ .[] | select(.state | IN("PENDING","EXPECTED","QUEUED","IN_PROGRESS")) ]
              | map(.name) | join(", ")' checks.json)

            MISSING=""
            for name in "${REQUIRED[@]}"; do
              found=$(jq -r --arg n "$name" \
                '[ .[] | select(.name == $n and .state == "SUCCESS") ] | length' checks.json)
              [[ "$found" == "0" ]] && MISSING="${MISSING:+$MISSING, }$name"
            done

            if [[ -z "$PENDING" && -z "$MISSING" ]]; then
              echo "All checks green."
              break
            fi

            if (( SECONDS > DEADLINE )); then
              echo "::error::Timed out after 20m. Pending: ${PENDING:-none}. Required but not yet green: ${MISSING:-none}."
              exit 1
            fi

            echo "Waiting… pending: ${PENDING:-none}; required not yet green: ${MISSING:-none}"
            sleep 20
          done

      # Same mechanism and input as pr-sweeper.yml. `gh workflow run` targets
      # the default branch, so main's claude-review.yml runs, never the PR's.
      # The marker goes on only after the dispatch call succeeded; if the
      # dispatch itself fails, this step goes red and no marker is written.
      - name: Dispatch the Claude review
        if: steps.gate.outputs.eligible == 'false' && steps.hold.outputs.dispatched == 'false'
        env:
          COMMENT_ID: ${{ steps.hold.outputs.comment_id }}
        run: |
          set -euo pipefail
          gh workflow run claude-review.yml --repo "$REPO" -f pr_number="$PR"
          echo "Dispatched claude-review.yml for PR #$PR."

          body=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body)
          note="_Checks green — Claude review dispatched $(date -u +'%Y-%m-%d %H:%M UTC') by [this run](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID})._"
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" \
            -f body="${body}"$'\n\n<!-- claude-review-dispatched -->\n'"${note}" > /dev/null

      # `--delete-branch` is explicit because the repo has
      # `delete_branch_on_merge: false`; squash keeps main's history one commit
      # per PR, matching how these have been merged by hand.
      - name: Merge
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          echo "Merged PR #$PR."
