<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- user-scalable=no is INTENTIONAL (a documented Lighthouse A11y trade-off, not an oversight):
         this is a touch game where steering is a drag gesture — pinch-to-zoom mid-drag would hijack the
         input and break play. viewport-fit=cover gives iPhone safe-area / notch handling. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Neon Drift</title>
    <meta
      name="description"
      content="A synthwave endless racer — weave through traffic and chase the neon horizon."
    />
    <meta name="theme-color" content="#1a0033" />

    <!-- Open Graph — rich share unfurl with the captured Zen hero image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neon Drift" />
    <meta property="og:title" content="Neon Drift" />
    <meta
      property="og:description"
      content="A synthwave endless racer — weave through traffic and chase the neon horizon."
    />
    <meta property="og:url" content="https://neondrift-game.vercel.app" />
    <meta property="og:image" content="https://neondrift-game.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Neon Drift — a synthwave neon-grid horizon with glowing landmarks" />

    <!-- Twitter — large-image card (now that the hero image ships). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Neon Drift" />
    <meta
      name="twitter:description"
      content="A synthwave endless racer — weave through traffic and chase the neon horizon."
    />
    <meta name="twitter:image" content="https://neondrift-game.vercel.app/og-image.png" />

    <!-- PWA: home-screen install + fullscreen standalone (iPhone). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Drift" />
    <!-- iOS home-screen icon — a 180×180 raster of the synthwave favicon on an opaque #1a0033 square
         (iOS doesn't render SVG apple-touch-icons + wants an opaque bg; it rounds the corners itself). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />

    <!-- Schema.org VideoGame — describes the game to crawlers in the static payload (the canvas is
         opaque to bots). Real values only; no invented URL/rating. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Neon Drift",
        "description": "A synthwave endless racer — weave through traffic and chase the neon horizon, or cruise the Zen free-roam.",
        "genre": ["Racing", "Arcade"],
        "applicationCategory": "Game",
        "operatingSystem": "Web Browser",
        "browserRequirements": "Requires JavaScript and WebGL."
      }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Bot / crawler / no-JS readable description (the WebGL canvas is otherwise opaque to them).
           Renders only when scripting is disabled — zero interference with the running game. -->
      <noscript>
        <h1>Neon Drift</h1>
        <p>
          A synthwave endless racer: weave through neon traffic and chase the horizon for a high
          score, or cruise the Zen free-roam mode through a procedural neon world.
        </p>
        <p>Enable JavaScript to play in your browser.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
